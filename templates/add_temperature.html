<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <title>新增溫溼度</title>
</head>
<body class="bg-light">
    <nav class="navbar navbar-expand navbar-light bg-white border-bottom mb-4">
        <div class="container">
            <span class="navbar-brand mb-0 h1">溫溼度監控系統</span>
            <a class="nav-link" href="{% url 'view_history_temperature' %}">溫溼度歷史</a>
        </div>
    </nav>
    <div class="container" style="max-width: 600px;">
        <div class="card shadow-sm">
            <div class="card-body">
                <h5 class="card-title text-center mb-4">新增溫溼度資料</h5>
                <form action="{% url 'add_temperature' %}" method="post">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label for="sensor_id" class="form-label">Sensor ID</label>
                        <input type="text" class="form-control" id="sensor_id" name="sensor_id" required>
                    </div>
                    <div class="mb-3">
                        <label for="temperature" class="form-label">溫度</label>
                        <input type="text" class="form-control" id="temperature" name="temperature" required>
                    </div>
                    <div class="mb-3">
                        <label for="humidity" class="form-label">濕度</label>
                        <input type="text" class="form-control" id="humidity" name="humidity" required>
                    </div>
                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-primary">新增</button>
                        <button type="reset" class="btn btn-outline-secondary">取消</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</body>
</html>
