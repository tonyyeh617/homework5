<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <title>即時溫溼度顯示</title>
    <meta http-equiv="refresh" content="10">
</head>
<body class="bg-light">
    <nav class="navbar navbar-expand navbar-light bg-white border-bottom mb-4">
        <div class="container">
            <span class="navbar-brand mb-0 h1">溫溼度監控系統</span>
            <a class="nav-link" href="{% url 'view_history_temperature' %}">溫溼度歷史</a>
        </div>
    </nav>
    <div class="container" style="max-width: 500px;">
        <div class="card shadow-sm">
            <div class="card-body text-center">
                <h5 class="card-title mb-4">目前溫濕度</h5>
                <div class="row g-3 justify-content-center">
                    <div class="col-6">
                        <label class="form-label">目前溫度</label>
                        <input type="text" class="form-control text-center" value="{{ data.temperature }}" disabled>
                    </div>
                    <div class="col-6">
                        <label class="form-label">目前濕度</label>
                        <input type="text" class="form-control text-center" value="{{ data.humidity }}" disabled>
                    </div>
                </div>
            </div>
        </div>
        <footer class="text-center text-muted small mt-4">
            <p>Copyright &copy;2024 <a href="">tony yeh</a> ALL rights reserved.</p>
        </footer>
    </div>
</body>
</html>
