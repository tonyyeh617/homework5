<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <title>即時溫溼度顯示</title>
    <script>
        //頁面載入，簡寫方式
        $(function(){
            console.log("Page loaded");
            refresh();
            //每隔5秒刷新一次
            // setInterval(refresh, 10000);//10000: 每隔10秒刷新一次
            setInterval(countdown, 1000); //每隔1秒更新倒數計時
        });

        //倒數計時功能
        var timer=10;
        function countdown(){
            timer--;
            if(timer <= 0){
                timer = 10;
                refresh(); //刷新資料
            }
            $(".panel_time").text(timer + "秒後更新");
        }

        function refresh(){
            console.log("Refreshing data");
            $.get("/show_temperature_API/", function(data){
                console.log("Data received:", data);
                if(data.length > 0){
                    //取得溫度與濕度
                    temperature = data[0].temperature;
                    humidity = data[0].humidity;
                    console.log("Temperature:", temperature, "Humidity:", humidity);
                    //顯示在輸入框中
                    $("#temperature").val(temperature);
                    $("#humidity").val(humidity);
                //     $("input[disabled]").eq(0).val(data[0].temperature);
                //     $("input[disabled]").eq(1).val(data[0].humidity);
                }
            }).fail(function(){
                console.log("Failed to fetch data");
                $("#temperature").val("無法取得");
                $("#humidity").val("無法取得");
            });
        }

    </script>
</head>
<body class="bg-light">
    <nav class="navbar navbar-expand navbar-light bg-white border-bottom mb-4">
        <div class="container">
            <span class="navbar-brand mb-0 h1">溫溼度監控系統</span>
            <a class="nav-link" href="{% url 'view_history_temperature' %}">溫溼度歷史</a>
        </div>
    </nav>
    <div class="container" style="max-width: 500px;">
        <div class="card shadow-sm">
            <div class="card-body text-center">
                <h5 class="card-title mb-4">目前溫濕度</h5>
                <div class="row g-3 justify-content-center">
                    <div class="col-6">
                        <label class="form-label">目前溫度</label>
                        <input type="text" class="form-control text-center" id="temperature" value="" disabled>
                    </div>
                    <div class="col-6">
                        <label class="form-label">目前濕度</label>
                        <input type="text" class="form-control text-center" id="humidity" value="" disabled>
                    </div>
                </div>
                <p class="panel_time text-muted small mt-3 mb-0">10秒</p>
            </div>
        </div>
        <footer class="text-center text-muted small mt-4">
            <p>Copyright &copy;2024 <a href="">tony yeh</a> ALL rights reserved.</p>
        </footer>
    </div>
</body>
</html>
